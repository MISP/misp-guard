version: 1
disable_existing_loggers: no
formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  verbose:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: verbose
    stream: ext://sys.stdout
  file:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: simple
    # rotated daily, one year of rotated logs is kept, raise `backupCount` to
    # keep them longer (e.g. 1825 for five years)
    when: D
    backupCount: 365
    filename: ./logs/misp-guard.log
loggers:
  root:
    level: INFO
    handlers: [console, file]
watchdog:
  level: ERROR
  propagate: no
